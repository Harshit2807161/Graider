services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: graider
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/graider
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Shared with the worker through the ./backend/data volume
      - UPLOAD_DIR=/app/data/uploads
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-gpt-5-nano-2025-08-07}
      - LLM_GRADER_MODEL=${LLM_GRADER_MODEL:-gpt-5-nano-2025-08-07}
      - LLM_ORCHESTRATOR_MODEL=${LLM_ORCHESTRATOR_MODEL:-gpt-5-nano-2025-08-07}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/data:/app/data

  worker:
    build:
      context: ./backend
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/graider
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Shared with the worker through the ./backend/data volume
      - UPLOAD_DIR=/app/data/uploads
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-gpt-5-nano-2025-08-07}
      - LLM_GRADER_MODEL=${LLM_GRADER_MODEL:-gpt-5-nano-2025-08-07}
      - LLM_ORCHESTRATOR_MODEL=${LLM_ORCHESTRATOR_MODEL:-gpt-5-nano-2025-08-07}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/data:/app/data

volumes:
  postgres_data:
  minio_data:
