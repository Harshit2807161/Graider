# Shared settings for the backend image (API, worker and one-shot migrate job).
# Only `backend` builds the image; `migrate` and `worker` reuse it (building the same tag
# from several services races).
x-backend: &backend
  image: graider-backend
  # API keys and LLM__* model settings (per-role models/fallbacks) come from the root .env
  env_file:
    - path: .env
      required: false
  environment:
    - DATABASE_URL=postgresql://user:password@db:5432/graider
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # Shared between API and worker through the ./backend/data volume
    - UPLOAD_DIR=/app/data/uploads
    - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
  volumes:
    - ./backend/data:/app/data

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: graider
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d graider"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Applies pending Alembic migrations, then exits. API and worker start after it succeeds.
  migrate:
    <<: *backend
    pull_policy: never
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    <<: *backend
    pull_policy: never
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Optional: LLM observability (Langfuse) is in docker-compose.langfuse.yml

volumes:
  postgres_data:
  minio_data:
