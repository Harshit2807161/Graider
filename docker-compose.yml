# Shared settings for the backend image (API, worker and one-shot migrate job).
# Only `backend` builds the image; `migrate` and `worker` reuse it (building the same tag
# from several services races).
x-backend: &backend
  image: graider-backend
  # API keys and LLM__* model settings (per-role models/fallbacks) come from the root .env
  env_file:
    - path: .env
      required: false
  environment:
    - DATABASE_URL=postgresql://user:password@db:5432/graider
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # Shared between API and worker through the ./backend/data volume
    - UPLOAD_DIR=/app/data/uploads
    # Office documents are converted by the sandboxed `gotenberg` service (only the worker calls it)
    - GOTENBERG_URL=http://gotenberg:3000
    - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
  volumes:
    - ./backend/data:/app/data

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: graider
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d graider"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Applies pending Alembic migrations, then exits. API and worker start after it succeeds.
  migrate:
    <<: *backend
    pull_policy: never
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    <<: *backend
    pull_policy: never
    restart: always
    command: celery -A app.worker.celery_app worker -Q celery,rubric --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [default, converter]

  # Converts Word/ODT/RTF/PowerPoint uploads to PDF with LibreOffice (Proposal 003). Untrusted office
  # files are only ever opened here: on a private network the worker shares and that has no internet
  # access, read-only, unprivileged, resource-limited, LibreOffice restarted every 10 conversions.
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-libreoffice  # pinned; LibreOffice-only variant (no Chromium)
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=90s
      - --api-body-limit=60MB
      - --libreoffice-restart-after=10
      - --webhook-deny-private-ips=true
      - --api-download-from-deny-private-ips=true
    networks: [converter]
    read_only: true
    tmpfs:
      - /tmp
      - /home/gotenberg
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: LLM observability (Langfuse) is in docker-compose.langfuse.yml

networks:
  default: {}
  converter:
    internal: true  # no route to the internet

volumes:
  postgres_data:
  minio_data:
