# Shared settings for the backend image (API, worker and one-shot migrate job).
# Only `backend` builds the image; `migrate` and `worker` reuse it (building the same tag
# from several services races).
x-backend: &backend
  image: graider-backend
  # API keys and LLM__* model settings (per-role models/fallbacks) come from the root .env
  env_file:
    - path: .env
      required: false
  environment:
    - DATABASE_URL=postgresql://user:password@db:5432/graider
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # Shared between API and worker through the ./backend/data volume
    - UPLOAD_DIR=/app/data/uploads
    - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
  volumes:
    - ./backend/data:/app/data

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: graider
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d graider"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Applies pending Alembic migrations, then exits. API and worker start after it succeeds.
  migrate:
    <<: *backend
    pull_policy: never
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    <<: *backend
    pull_policy: never
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # ---- Optional observability (MLflow tracing UI): docker compose --profile observability up -d
  # Engineering traces only; the audit record is the grading_runs/llm_calls tables in `db`.
  # Point the worker at it with MLFLOW_TRACKING_URI=http://mlflow:5000 in .env.
  mlflow-db:
    image: postgres:15-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    # Pinned; keep the server version >= the mlflow-tracing client version
    image: ghcr.io/mlflow/mlflow:v3.16.1-full
    profiles: ["observability"]
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts mlflow:5000,localhost:5001,127.0.0.1:5001
    ports:
      - "5001:5000"  # 5000 is often taken on macOS (AirPlay)
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      mlflow-db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  mlflow_db:
  mlartifacts:
