name: gr8r
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - poppler  # pdf2image needs pdftoppm
  # Development tools (ruff comes from requirements-dev.txt)
  - black
  - pip:
      # Runtime deps (shared with the Docker image) + test/lint tools
      - -r backend/requirements-dev.txt
