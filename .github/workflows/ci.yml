name: CI

on:
  pull_request:
  push:
    branches: [master, v1-full]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8.0"
      - name: ruff
        working-directory: backend
        run: ruff check app tests alembic

  backend-tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System packages (pdf2image needs poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest (SQLite, fake LLM)
        working-directory: backend
        run: pytest -q

  backend-tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: graider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d graider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System packages (pdf2image needs poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r backend/requirements-dev.txt
      - name: Create a dedicated migrations database
        run: psql -h localhost -U ci -d graider_test -c "CREATE DATABASE graider_mig"
      - name: Migrations apply cleanly and match the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/graider_mig
        run: |
          alembic upgrade head
          alembic check
      - name: pytest (Postgres, fake LLM)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/graider_test
          MIGRATIONS_DATABASE_URL: postgresql://ci:ci@localhost:5432/graider_mig
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
