<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "on-primary": "#ffffff",
                        "primary-container": "#dce1ff",
                        "on-primary-container": "#00164d",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .camera-view {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden
        }
        .camera-feed {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAqOp82RP_IJLs2dPx5dikno9gGLWrtIv4E6FlVm0SHKHHPldC0-kjIz0D_DDJimZiMUD9Df5V9UH0ruf-GHaXHa3qTo-3C_WX541L5wRx48XxWBN35Yv0-GiVi5hw4MkdB4P2eetBQCQLtJf6C2bLrntmjnYIwFQ_bAAVRa4y1mHKBD0YoX16KYVwytihKqF32KC-TXs6XdQTdfgiAgIngXSOYbCDjh5lCaAni3e3KeGf4eZARrBd1z-RNsflzDSrjKJi20gjOkIwt);
            background-size: cover;
            background-position: center;
            height: 100%;
            width: 100%;
            filter: brightness(0.9)
        }
        .scan-overlay {
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); 
        }
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #1152d4;
            border-style: solid
        }
        .corner-tl {
            top: -2px;
            left: -2px;
            border-width: 4px 0 0 4px;
            border-radius: 8px 0 0 0
        }
        .corner-tr {
            top: -2px;
            right: -2px;
            border-width: 4px 4px 0 0;
            border-radius: 0 8px 0 0
        }
        .corner-bl {
            bottom: -2px;
            left: -2px;
            border-width: 0 0 4px 4px;
            border-radius: 0 0 0 8px
        }
        .corner-br {
            bottom: -2px;
            right: -2px;
            border-width: 0 4px 4px 0;
            border-radius: 0 0 8px 0
        }
        body {
            min-height: max(800px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden antialiased">
<div class="camera-view relative flex flex-col justify-between">
<div class="camera-feed absolute inset-0 z-0" data-alt="Overhead view of an exam paper on a wooden desk"></div>
<div class="absolute top-0 w-full h-40 bg-gradient-to-b from-black/80 to-transparent z-10 pointer-events-none"></div>
<div class="relative z-20 px-4 pt-14 pb-4 flex items-start justify-between">
<button class="p-3 rounded-full bg-black/30 backdrop-blur-md hover:bg-black/50 transition text-white">
<span class="material-icons-round text-2xl">close</span>
</button>
<div class="flex flex-col items-center flex-1 mx-4 pt-2">
<div class="bg-black/60 backdrop-blur-xl px-6 py-3 rounded-full border border-white/10 shadow-lg flex items-center gap-2 max-w-xs text-center justify-center">
<span class="text-sm font-semibold tracking-wide text-white">Step 1: Scan Student Info</span>
</div>
</div>
<button class="p-3 rounded-full bg-black/30 backdrop-blur-md hover:bg-black/50 transition text-white relative">
<span class="material-icons-round text-2xl">flash_off</span>
</button>
</div>
<div class="relative z-10 flex-1 flex items-center justify-center p-8">
<div class="relative w-full aspect-[3/4] max-w-[320px] transform rotate-0 transition-all duration-300 ease-out">
<div class="absolute inset-0 bg-transparent border-2 border-primary scan-overlay rounded-xl"></div>
<div class="absolute top-0 left-0 w-full h-0.5 bg-primary shadow-[0_0_20px_2px_#1152d4] opacity-80" style="animation: scan 2.5s ease-in-out infinite;">
<style>
                        @keyframes scan {
                            0%, 100% { top: 5%; opacity: 0; }
                            10% { opacity: 1; }
                            50% { top: 95%; }
                            90% { opacity: 1; }
                        }
                    </style>
</div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none opacity-20">
<div class="border-r border-b border-white"></div>
<div class="border-r border-b border-white"></div>
<div class="border-b border-white"></div>
<div class="border-r border-b border-white"></div>
<div class="border-r border-b border-white"></div>
<div class="border-b border-white"></div>
<div class="border-r border-white"></div>
<div class="border-r border-white"></div>
<div></div>
</div>
</div>
<div class="absolute top-1/3 left-12 w-3 h-3 bg-primary rounded-full animate-ping opacity-75"></div>

</div>
<div class="relative z-20 pb-12 pt-8 px-6 bg-gradient-to-t from-black/95 via-black/80 to-transparent">
<div class="flex items-center justify-between max-w-md mx-auto w-full px-2">
<div class="flex-1 flex justify-start items-center">
<div class="flex flex-col items-center gap-1">
<div class="relative group">
<div class="w-14 h-14 bg-white/5 rounded-xl border border-dashed border-white/30 flex items-center justify-center">
<span class="material-icons-round text-white/30 text-xl">image</span>
</div>
</div>
</div>
</div>
<div class="flex-1 flex justify-center">
<button class="relative w-[84px] h-[84px] rounded-full border-[6px] border-white/90 flex items-center justify-center group active:scale-95 transition-transform duration-150 shadow-2xl bg-transparent hover:bg-white/10">
<div class="w-[66px] h-[66px] bg-white rounded-full group-active:scale-90 transition-transform duration-200 shadow-inner"></div>
</button>
</div>
<div class="flex-1 flex justify-end items-center">
<button class="bg-white/10 text-white/40 cursor-not-allowed text-sm font-semibold px-5 py-3 rounded-full transition-all flex items-center gap-2 whitespace-nowrap" disabled="">
<span>Finish &amp; Review</span>
</button>
</div>
</div>
<div class="h-6 mt-2"></div>
</div>
</div>
