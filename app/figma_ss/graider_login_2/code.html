<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Graider - Add New Course</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "on-primary": "#ffffff",
                        "primary-container": "#dbe1ff",
                        "on-primary-container": "#00174a",
                        "background-light": "#fdfbff",
                        "background-dark": "#1a1c1e",
                        "surface": "#fdfbff",
                        "surface-dark": "#1a1c1e",
                        "surface-variant": "#e1e2ec",
                        "surface-variant-dark": "#44474f",
                        "outline": "#74777f",
                        "outline-dark": "#8e9099",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply min-h-[800px] h-screen w-full overflow-hidden flex flex-col items-center bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200;
            }
        }
        .md3-input-wrapper {
            position: relative;
            width: 100%;
        }
        .md3-input {
            width: 100%;
            height: 56px;
            border-radius: 4px 4px 0 0;
            padding: 24px 16px 8px;
            background-color: transparent;
            border-bottom: 1px solid #74777f;
            outline: none;
            transition: all 0.2s;
        }
        .dark .md3-input {
            border-bottom-color: #8e9099;
        }
        .md3-input:focus {
            border-bottom-color: #1152d4;
            border-bottom-width: 2px;
        }
        .dark .md3-input:focus {
            border-bottom-color: #adc6ff;
        }
        .md3-label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 16px;
            color: #74777f;
            pointer-events: none;
            transition: 0.2s ease all;
        }
        .dark .md3-label {
            color: #c4c6d0;
        }
        .md3-input:focus ~ .md3-label,
        .md3-input:not(:placeholder-shown) ~ .md3-label {
            top: 8px;
            font-size: 12px;
            color: #1152d4;
        }
        .dark .md3-input:focus ~ .md3-label,
        .dark .md3-input:not(:placeholder-shown) ~ .md3-label {
            color: #adc6ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-20 -right-20 w-80 h-80 bg-primary/10 rounded-full blur-3xl opacity-30"></div>
<div class="absolute -bottom-32 -left-20 w-96 h-96 bg-primary/5 rounded-full blur-3xl opacity-20"></div>
</div>
<main class="relative z-10 flex flex-col h-full w-full max-w-[360px] px-6 pt-12 pb-8 safe-area-inset-bottom mx-auto justify-start">
<div class="flex items-center space-x-4 mb-8">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-variant/50 dark:hover:bg-surface-variant-dark/50 transition-colors text-slate-700 dark:text-slate-200">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-2xl font-semibold text-slate-900 dark:text-white">Add New Course</h1>
</div>
<div class="flex flex-col items-center mb-8">
<div class="relative group">
<div class="absolute -inset-1 bg-primary/20 rounded-2xl blur-lg opacity-40"></div>
<div class="relative h-16 w-16 bg-surface dark:bg-surface-dark border border-surface-variant/50 dark:border-surface-variant-dark/50 rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-3xl text-primary dark:text-blue-400">school</span>
</div>
</div>
<p class="text-sm font-medium text-slate-500 dark:text-slate-400 mt-3 text-center">Enter course details to begin grading</p>
</div>
<div class="flex flex-col w-full space-y-6">
<div class="space-y-4">
<div class="md3-input-wrapper">
<input class="md3-input bg-surface-variant/20 dark:bg-surface-variant-dark/20 border-t-0 border-x-0 focus:ring-0" id="courseName" placeholder=" " type="text"/>
<label class="md3-label" for="courseName">Course Name (e.g. CS101)</label>
</div>
<div class="md3-input-wrapper">
<input class="md3-input bg-surface-variant/20 dark:bg-surface-variant-dark/20 border-t-0 border-x-0 focus:ring-0" id="examTitle" placeholder=" " type="text"/>
<label class="md3-label" for="examTitle">Exam Title (e.g. Midterm)</label>
</div>
<div class="md3-input-wrapper">
<input class="md3-input bg-surface-variant/20 dark:bg-surface-variant-dark/20 border-t-0 border-x-0 focus:ring-0" id="department" placeholder=" " type="text"/>
<label class="md3-label" for="department">Department</label>
<div class="absolute right-3 top-4 pointer-events-none text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">domain</span>
</div>
</div>
</div>
<div class="space-y-3 pt-8">
<button class="w-full bg-primary hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 text-on-primary font-semibold h-12 rounded-full shadow-md transition-all flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-lg">add_circle</span>
<span class="text-base tracking-wide">Create Course</span>
</button>
<button class="w-full bg-transparent text-slate-600 dark:text-slate-300 font-medium h-12 rounded-full hover:bg-surface-variant/30 dark:hover:bg-surface-variant-dark/30 transition-colors flex items-center justify-center">
<span class="text-sm tracking-wide">Cancel</span>
</button>
</div>
</div>
</main>
<div class="fixed inset-0 z-0 opacity-[0.02] dark:opacity-[0.04] pointer-events-none bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBZDDKr4pqjkFjqYGlXyN2Q_HGlhiD_p-PUMwiofsQJKj1tNGcgoc5LIaSY-B0jOOjdOQKBolJA9y28EvaE5VKcWdiA9-1gtIEbROBJSFCKlZkC7N6nic-9eRBRQmIRnouqo8_cJ68ZFpoFTS1yQveaAer0AHWG-OJud5cUGNRGZMIaOUoQQboDcaMffZdATee6LWbLVcaqgDpLN1GkiXWIz99t-9D2hyMBZQlC528k5g6U13KIhTIPaiMzrZZRl7hgrnogpgRyBFxz');"></div>
</body></html>
