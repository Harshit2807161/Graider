name: graider
description: "AI-powered grading system for handwritten subjective answers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database (reactive SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Networking
  dio: ^5.7.0

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1

  # Secure storage
  flutter_secure_storage: ^9.2.3

  # Splash screen
  flutter_native_splash: ^2.4.3

  # Document scanning
  cunning_document_scanner: ^1.4.0

  # Image processing (blur detection)
  image: ^4.3.0

  # File picking (Q-paper / Answer Key uploads)
  file_picker: ^8.1.6
  dio_smart_retry: ^7.0.1
  shared_preferences: ^2.5.4
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

  # Linting
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
